[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-service"
version = "0.3.0"
description = "Small HTTP API for creating and tracking customer invoices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["invoicing*"]

[tool.setuptools.package-data]
invoicing = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=invoicing --cov-report=term-missing"
markers = ["slow: tests that exercise the full migration chain"]

[tool.coverage.run]
branch = true
source = ["invoicing"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
